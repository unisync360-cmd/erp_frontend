  /* ---------- CENTERED LOGIN CARD ---------- */
  .center-wrap{
    flex:1;
    width:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:34px 20px;
  }

  .card{
    width:100%;
    max-width:390px;
    background:#fff;
    border-radius:22px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);
    padding:34px 30px 28px;
  }

  .login-logo{
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0 auto 14px;
    position:relative;
    z-index:4;
  }

  .login-logo img{ height:118px; width:auto; display:block; }

  .login-head{
    text-align:center;
    margin-top:14px;
  }

  .login-head h2{
    font-size:25px;
    color:var(--ink);
    font-weight:700;
  }

  .login-head .rule{
    width:52px;
    height:3px;
    background:var(--joy-red);
    margin:11px auto 12px;
    border-radius:2px;
  }

  .login-head p{
    color:var(--slate-500);
    font-size:14.5px;
  }

  .role-toggle{
    display:flex;
    background:#eef1f6;
    border-radius:12px;
    padding:4px;
    gap:4px;
    margin:18px 0 20px;
  }

  .role-toggle button{
    flex:1;
    border:none;
    background:transparent;
    padding:10px 0;
    border-radius:9px;
    font-size:13.5px;
    font-weight:600;
    color:#64748b;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }

  .role-toggle button.active{
    background:#fff;
    color:var(--joy-red);
    box-shadow:0 3px 8px rgba(20,30,60,.10);
  }

  form{ margin-top:22px; }

  .field{
    display:flex;
    align-items:center;
    gap:12px;
    border:1px solid #e2e6ee;
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:16px;
  }

  .field svg{
    width:18px;
    height:18px;
    stroke:#8b95a7;
    flex-shrink:0;
  }

  .field input{
    border:none;
    outline:none;
    flex:1;
    font-size:14.5px;
    color:#1f2937;
    background:transparent;
  }

  .field input::placeholder{ color:#9aa3b2; }

  .field .eye{ cursor:pointer; }

  .captcha-box{
    background:#eef1f6;
    border-radius:12px;
    padding:16px 16px 18px;
    margin-bottom:18px;
  }

  .captcha-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .captcha-row svg{ width:20px; height:20px; stroke:#8b95a7; flex-shrink:0; }
  .captcha-row svg.refresh{ cursor:pointer; }

  .captcha-digits{
    display:flex;
    gap:6px;
    font-family:Georgia, serif;
    font-weight:700;
    font-size:22px;
    color:var(--ink);
    position:relative;
  }

  .captcha-digits span{ display:inline-block; }
  .captcha-digits span:nth-child(2n){ transform:rotate(-6deg) translateY(2px); }
  .captcha-digits span:nth-child(3n){ transform:rotate(5deg) translateY(-2px); }

  .captcha-digits::after{
    content:"";
    position:absolute;
    left:-2px; right:-2px; top:50%;
    height:1px;
    background:repeating-linear-gradient(90deg, #9aa3b2 0 6px, transparent 6px 10px);
    transform:rotate(-3deg);
  }

  .captcha-label{
    font-size:12.5px;
    font-weight:600;
    color:#64748b;
    letter-spacing:.3px;
    margin-bottom:10px;
  }

  .captcha-inputs{
    display:flex;
    gap:8px;
    margin-top:14px;
  }

  .captcha-inputs input{
    width:100%;
    aspect-ratio:1/1;
    text-align:center;
    border:1px solid #e2e6ee;
    border-radius:9px;
    background:#fff;
    font-size:15px;
    outline:none;
  }

  .captcha-inputs input:focus{ border-color:var(--joy-red); }

  .access-btn{
    width:100%;
    border:none;
    border-radius:999px;
    padding:15px;
    background:linear-gradient(135deg, var(--joy-red) 0%, var(--joy-red-dark) 100%);
    color:#fff;
    font-size:15px;
    font-weight:700;
    letter-spacing:.5px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    transition:filter .15s ease, transform .15s ease;
  }

  .access-btn:hover{ filter:brightness(1.08); transform:translateY(-1px); }
  .access-btn svg{ width:16px; height:16px; stroke:#fff; }

  .card-foot{
    text-align:center;
    margin-top:18px;
  }

  .card-foot .shield-rule{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:12px;
  }

  .card-foot .shield-rule .line{ flex:1; height:1px; background:#e2e6ee; }
  .card-foot .shield-rule svg{ width:18px; height:18px; stroke:#8b95a7; }

  .card-foot p{ font-size:13px; color:#8b95a7; }
  .card-foot a{ color:var(--joy-red); text-decoration:none; font-weight:600; }
  
  /* ---------- TRANSPARENT WHITE GLASS THEME ---------- */
  .center-wrap{ padding:24px 16px; }

  .card{
    background:rgba(255,255,255,.58);
    -webkit-backdrop-filter:blur(14px) saturate(110%);
    backdrop-filter:blur(14px) saturate(110%);
    border:1px solid rgba(255,255,255,.8);
    box-shadow:0 20px 50px rgba(0,0,0,.22);
    color:var(--ink);
  }

  .uni-id img{ height:100px; }

  .role-toggle{ background:rgba(255,255,255,.55); border:1px solid rgba(31,42,68,.10); }
  .role-toggle button{ color:#4b5563; }
  .role-toggle button.active{ background:#fff; color:var(--joy-red); }

  .field{
    background:rgba(255,255,255,.65);
    border:1px solid rgba(31,42,68,.18);
  }
  .field svg{ stroke:#6b7280; }
  .field input{ color:var(--ink); }
  .field input::placeholder{ color:#6b7280; }

  .captcha-box{ background:rgba(255,255,255,.55); border:1px solid rgba(31,42,68,.10); }
  .captcha-label{ color:#4b5563; }
  .captcha-inputs input{
    background:rgba(255,255,255,.85);
    border:1px solid rgba(31,42,68,.2);
    color:var(--ink);
  }
  .captcha-inputs input:focus{ border-color:var(--joy-red); }
  .captcha-row svg{ stroke:#6b7280; }
  .captcha-digits{ color:var(--ink); }

  .access-btn{
    background:linear-gradient(135deg,var(--joy-red) 0%,var(--joy-red-dark) 100%);
    box-shadow:0 8px 20px rgba(0,0,0,.2);
  }

  .card-foot .shield-rule .line{ background:rgba(31,42,68,.18); }
  .card-foot .shield-rule svg{ stroke:#6b7280; }
  .card-foot p{ color:#4b5563; }
  .card-foot a{ color:var(--joy-red); text-decoration:underline; }

  /* ---------- FLOATING BENEFITS ---------- */
  /* ---------- FOUR-IN-ONE TRANSPARENT BENEFITS CARD ---------- */
  .benefits-bar{
    width:min(72vw,360px);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    align-items:stretch;
    margin:0 auto 14px;
    padding:4px;
    color:#fff;
    text-align:center;
    position:relative;
    z-index:3;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.28);
    border-radius:13px;
    box-shadow:0 8px 20px rgba(0,0,0,.14);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    overflow:hidden;
    text-shadow:0 2px 8px rgba(0,0,0,.28);
  }
  .benefit{
    min-width:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    padding:4px 3px;
  }
  .benefit + .benefit{
    border-left:1px solid rgba(255,255,255,.35);
  }
  .benefit svg{width:18px;height:18px;flex:0 0 auto}
  .benefit span{font-size:8.5px;line-height:1.15;font-weight:650;white-space:nowrap}

  /* ---------- MOBILE (compact card) ---------- */
  @media (max-width:480px){
    body{justify-content:flex-start}
    .center-wrap{padding:26px 10px 0;min-height:auto;flex:none}
    .card{width:100%;max-width:300px;padding:13px 12px 12px;border-radius:16px}
    .login-logo{margin:0 auto 10px}.login-logo img{height:82px}
    .login-head{margin-top:6px}.login-head h2{font-size:20px}.login-head p{font-size:11px}
    .role-toggle{margin:8px 0 9px;padding:3px;border-radius:8px}
    .role-toggle button{font-size:10.5px;padding:5px 0;border-radius:6px}
    form{margin-top:0}.field{padding:7px 9px;margin-bottom:7px;gap:7px;border-radius:8px}
    .field svg{width:14px;height:14px}.field input{font-size:11.5px}
    .captcha-box{padding:7px 9px 8px;margin-bottom:8px;border-radius:8px}
    .captcha-label{font-size:9.5px;margin-bottom:4px}.captcha-inputs{gap:3px;margin-top:5px}
    .captcha-inputs input{font-size:11px;border-radius:5px}.captcha-row{margin-top:6px !important}
    .captcha-row svg{width:14px;height:14px}.captcha-digits{font-size:14px;gap:3px}
    .access-btn{padding:8px;font-size:11.5px}.access-btn svg{width:13px;height:13px}
    .card-foot{margin-top:8px}.card-foot .shield-rule{margin-bottom:5px;gap:6px}
    .card-foot .shield-rule svg{width:14px;height:14px}.card-foot p{font-size:9.5px}
    .benefits-bar{
      width:calc(100% - 28px);
      max-width:280px;
      grid-template-columns:repeat(4,1fr);
      gap:0;
      margin:6px auto 10px;
      padding:3px;
      border-radius:11px;
    }
    .benefit{gap:2px;padding:4px 2px}.benefit + .benefit{border-left:1px solid rgba(255,255,255,.32)}
    .benefit svg{width:16px;height:16px}.benefit span{font-size:7px;white-space:normal;line-height:1.05}
  }

/* FINAL RESPONSIVE CARD SIZING */
@media (min-width: 769px){
  .center-wrap{
    min-height:100vh;
    padding:24px 20px 18px;
    justify-content:center;
  }

  .card{
    width:100%;
    max-width:350px !important;
    padding:18px 18px 16px !important;
    border-radius:20px;
    margin:0 auto;
  }

  .uni-id img{
    height:76px !important;
    width:auto;
    max-width:220px;
    object-fit:contain;
  }

  .login-head{
    margin-top:8px;
  }

  .login-head h2{
    font-size:24px;
  }

  .login-head p{
    font-size:12px;
  }

  .role-toggle{
    margin:10px 0 11px;
  }

  .field{
    padding:9px 11px;
    margin-bottom:8px;
  }

  .captcha-box{
    padding:9px 11px 10px;
    margin-bottom:10px;
  }

  .access-btn{
    padding:10px;
  }

  .card-foot{
    margin-top:10px;
  }

  .benefits-bar{
    width:min(92vw, 720px);
    margin:5px auto 10px;
  }
}

/* Tablet and mobile: keep the compact mobile-style card */
@media (max-width:768px){
  .center-wrap{
    min-height:auto;
    padding:18px 12px 8px;
    justify-content:flex-start;
  }

  .card{
    width:100%;
    max-width:310px !important;
    padding:15px 13px 13px !important;
    margin:0 auto;
  }

  .uni-id img{
    height:62px !important;
    width:auto;
    max-width:190px;
    object-fit:contain;
  }

  .benefits-bar{
    width:100%;
    max-width:390px;
    margin:6px auto 8px;
    gap:5px;
  }

  .benefit svg{
    width:25px;
    height:25px;
  }

  .benefit span{
    font-size:8.5px;
  }
}


/* Smaller login card — keep feature options visible below */
@media (min-width: 769px){
  .card{
    max-width:310px !important;

  }
  .uni-id img{
    height:68px !important;
    max-width:205px;
  }

  .login-head h2{font-size:22px;}

}

@media (max-width:768px){
  .card{
    max-width:285px !important;

    height:58px !important;

<style id="final-login-benefits-layout">
  body{min-height:100vh;min-height:100dvh;justify-content:center;gap:14px;padding:24px 12px;}
  .center-wrap{width:100%;min-height:0!important;flex:0 0 auto;padding:0!important;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .login-logo{margin:0 auto 14px!important;}
  .login-logo img{height:120px!important;max-width:300px!important;width:auto!important;object-fit:contain;}
  .card{width:min(100%,330px)!important;max-width:330px!important;margin:0 auto!important;padding:17px 16px 14px!important;border-radius:20px;}
  .benefits-bar{display:grid!important;visibility:visible!important;opacity:1!important;width:min(calc(100vw - 32px),305px)!important;max-width:305px!important;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:0 auto!important;padding:7px 5px!important;border-radius:16px;position:relative;z-index:5;}
  .benefit{min-width:0;padding:7px 3px!important;gap:5px!important;}
  .benefit svg{width:22px!important;height:22px!important;}
  .benefit span{font-size:clamp(8px,1.1vw,11px)!important;line-height:1.1!important;white-space:normal!important;text-align:center;overflow-wrap:anywhere;}
  .benefit + .benefit{border-left:1px solid rgba(255,255,255,.38);}
  @media(max-width:768px){
    body{justify-content:flex-start;gap:10px;padding:16px 10px 18px;}
    .login-logo{margin-bottom:7px!important;}
    .login-logo img{height:100px!important;max-width:260px!important;}
    .card{width:min(100%,285px)!important;max-width:285px!important;padding:13px 12px 11px!important;border-radius:17px;}
    .benefits-bar{width:min(calc(100vw - 36px),265px)!important;max-width:265px!important;padding:5px 3px!important;border-radius:13px;}
    .benefit{padding:5px 2px!important;gap:3px!important;}
    .benefit svg{width:18px!important;height:18px!important;}
    .benefit span{font-size:clamp(7px,2.25vw,9px)!important;}
  }
  @media(max-height:650px) and (min-width:769px){body{padding-top:10px;padding-bottom:10px;gap:8px}.login-logo img{height:58px!important}.card{padding:11px 14px!important}.benefits-bar{padding:4px!important}}
</style>

<script>
  function togglePwd(icon){
    const input = icon.previousElementSibling;
    input.type = input.type === 'password' ? 'text' : 'password';
  }
  const captchaInputs = document.querySelectorAll('#captchaInputs input');
  captchaInputs.forEach((input, i) => {
    input.addEventListener('input', () => {
      input.value = input.value.replace(/[^0-9]/g, '').slice(0, 1);
      if(input.value && i < captchaInputs.length - 1){
        captchaInputs[i + 1].focus();
      }
    });
    input.addEventListener('keydown', (e) => {
      if(e.key === 'Backspace' && !input.value && i > 0){
        captchaInputs[i - 1].focus();
      }
    });
    input.addEventListener('focus', () => input.select());
  });

  function refreshCaptcha(){
    const digits = document.querySelectorAll('#captchaDigits span');
    digits.forEach(d => d.textContent = Math.floor(Math.random()*10));
  }

  const roleButtons = document.querySelectorAll('#roleToggle button');
  const idField = document.getElementById('idField');
  roleButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      roleButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const placeholders = {
        student: 'Enter your Registration Number',
        staff: 'Enter your Staff ID',
        admin: 'Enter your Admin ID'
      };
      idField.placeholder = placeholders[btn.dataset.role];
    });
  });
</script>
